name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup
        uses: ./.github/actions/setup

      - parallel:
          - name: Lint files
            run: yarn lint

          - name: Typecheck files
            run: yarn typecheck

  test-ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      HARNESS_IOS_DEVICE: Mobile Crypto Harness CI
      HARNESS_IOS_VERSION: '26.2'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Create iOS simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl create "$HARNESS_IOS_DEVICE" com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "com.apple.CoreSimulator.SimRuntime.iOS-${HARNESS_IOS_VERSION//./-}")
          echo "HARNESS_SIMULATOR_UDID=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Boot iOS simulator
        id: boot-simulator
        background: true
        run: |
          xcrun simctl boot "$HARNESS_SIMULATOR_UDID"
          xcrun simctl bootstatus "$HARNESS_SIMULATOR_UDID" -b

      - name: Install iOS dependencies
        working-directory: example
        run: pod install --project-directory=ios

      - name: Build example for simulator tests
        run: |
          xcodebuild \
            -workspace example/ios/MobileCryptoExample.xcworkspace \
            -scheme MobileCryptoExample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$HARNESS_SIMULATOR_UDID" \
            -derivedDataPath example/ios/build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Wait for iOS simulator
        wait: boot-simulator

      - name: Install example on simulator
        run: xcrun simctl install "$HARNESS_SIMULATOR_UDID" example/ios/build/Build/Products/Debug-iphonesimulator/MobileCryptoExample.app

      - name: Run native crypto tests
        run: yarn test --harnessRunner ios

  test-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HARNESS_ANDROID_DEVICE: Mobile_Crypto_Harness_CI
      HARNESS_ANDROID_SYSTEM_IMAGE: system-images;android-34;google_apis;x86_64
      HARNESS_APP_PATH: example/android/app/build/outputs/apk/debug/app-debug.apk
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Boot Android emulator
        id: boot-emulator
        background: true
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install emulator "$HARNESS_ANDROID_SYSTEM_IMAGE" > /dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force \
            --name "$HARNESS_ANDROID_DEVICE" --package "$HARNESS_ANDROID_SYSTEM_IMAGE" --device pixel_7
          nohup "$ANDROID_HOME/emulator/emulator" -avd "$HARNESS_ANDROID_DEVICE" \
            -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect \
            -camera-back none -camera-front none > "$RUNNER_TEMP/emulator.log" 2>&1 &
          ADB="$ANDROID_HOME/platform-tools/adb"
          timeout 600 "$ADB" wait-for-device
          timeout 600 bash -c "until [ \"\$('$ADB' shell getprop sys.boot_completed | tr -d '\r')\" = 1 ]; do sleep 2; done"

      - parallel:
          - name: Setup
            uses: ./.github/actions/setup

          - name: Install JDK
            uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
            with:
              distribution: 'zulu'
              java-version: '17'

          - name: Cache Gradle
            uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
            with:
              path: |
                ~/.gradle/wrapper
                ~/.gradle/caches
              key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
              restore-keys: |
                ${{ runner.os }}-gradle-

      - name: Build example for emulator tests
        working-directory: example/android
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
        run: ./gradlew assembleDebug --no-daemon --console=plain -PreactNativeArchitectures=x86_64

      - name: Wait for Android emulator
        wait: boot-emulator

      - name: Run native crypto tests
        run: yarn test --harnessRunner android

      - name: Upload emulator log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-emulator-log
          path: ${{ runner.temp }}/emulator.log

  build-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

  build-android:
    runs-on: ubuntu-latest
    env:
      TURBO_CACHE_DIR: .turbo/android
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for Android
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-android-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-android-

      - name: Check turborepo cache for Android
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:android').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Install JDK
        if: env.turbo_cache_hit != 1
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        if: env.turbo_cache_hit != 1
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Cache Gradle
        if: env.turbo_cache_hit != 1
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build example for Android
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
        run: |
          yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}"

  build-ios:
    runs-on: macos-15
    env:
      XCODE_VERSION: '26.3'
      TURBO_CACHE_DIR: .turbo/ios
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for iOS
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-ios-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-ios-

      - name: Check turborepo cache for iOS
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:ios').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Use appropriate Xcode version
        if: env.turbo_cache_hit != 1
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install iOS dependencies
        if: env.turbo_cache_hit != 1
        working-directory: example
        run: pod install --project-directory=ios

      - name: Build example for iOS
        run: |
          yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}"
